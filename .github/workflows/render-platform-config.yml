name: Render platform-config

# apps/platform-config.yaml 過去直接把 RDS host / 告警信箱寫死進版控。
# 這個 workflow 改成從 repo variables(PGHOST、ALERT_EMAIL)算繪產生,
# 值本身只存在 GitHub repo variables 裡,不再進到 git 歷史的新 commit。
# ArgoCD 對這個 repo 開了 selfHeal,commit 進 main 之後幾分鐘內就會同步到叢集,
# 所以觸發前務必先確認 repo variables 已經是你要的正式值。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/platform-config.yaml.tmpl"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render ConfigMap from repo variables
        env:
          PGHOST: ${{ vars.PGHOST }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${PGHOST}" ] || [ -z "${ALERT_EMAIL}" ] || [ -z "${SNS_TOPIC_ARN}" ]; then
            echo "請先在 repo variables 設定 PGHOST、ALERT_EMAIL 和 SNS_TOPIC_ARN,再重新觸發這個 workflow" >&2
            exit 1
          fi
          envsubst < apps/platform-config.yaml.tmpl > apps/platform-config.yaml

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- apps/platform-config.yaml; then
            echo "platform-config.yaml 沒有變化,跳過"
            exit 0
          fi
          git add apps/platform-config.yaml
          git commit -m "chore: render platform-config from repo variables"
          git push
