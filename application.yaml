apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: platform-apps, namespace: argocd }
spec:
  project: default
  source:
    repoURL: <你的 platform-gitops repo URL>
    targetRevision: main
    path: apps
  destination: { server: https://kubernetes.default.svc, namespace: default }
  syncPolicy:
    automated: { selfHeal: true, prune: true }
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
