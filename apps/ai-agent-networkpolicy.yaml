apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-agent-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: ai-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # engops-api 轉發 /incidents/{id}/ask(唯讀事故問答)用,兩者同在 default
    # namespace,podSelector 精準指到 engops-api,不開放整個 namespace。
    - from:
        - podSelector:
            matchLabels:
              app: engops-api
      ports:
        - protocol: TCP
          port: 8080
