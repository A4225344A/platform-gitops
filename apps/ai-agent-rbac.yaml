apiVersion: v1
kind: ServiceAccount
metadata: { name: ai-agent, namespace: default }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ai-agent, namespace: default }
rules:
  # 讀:診斷需要
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  # 寫:只有 restart(patch deployment 的 annotation)與 scale
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["patch", "update"]
  # 刻意沒有:delete、secrets、configmaps、任何 cluster 範圍資源
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ai-agent, namespace: default }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ai-agent }
subjects: [{ kind: ServiceAccount, name: ai-agent, namespace: default }]
