apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: ai-agent-blast-radius }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["deployments", "deployments/scale"]
  matchConditions:
    - name: only-ai-agent
      expression: "request.userInfo.username == 'system:serviceaccount:default:ai-agent'"
  validations:
    - expression: >-
        object.spec.replicas == oldObject.spec.replicas
      message: "replicas are owned by HPA; ai-agent must not modify them"
    - expression: >-
        !has(object.spec.template) ||
        object.spec.template.spec.containers == oldObject.spec.template.spec.containers
      message: "ai-agent may only restart by changing pod template metadata"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: ai-agent-blast-radius }
spec:
  policyName: ai-agent-blast-radius
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: default }
