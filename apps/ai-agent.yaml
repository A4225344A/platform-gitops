apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: ai-agent } }
  template:
    metadata: { labels: { app: ai-agent } }
    spec:
      serviceAccountName: ai-agent          # 任務 7.2 建立,受限權限
      containers:
        - name: agent
          image: ghcr.io/a4225344a/ai-agent:sha-752076123a54
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: LITELLM_URL,  value: "http://litellm:4000" }
            - { name: PRESIDIO_URL, value: "http://presidio:3000" }
            - { name: PROM_URL,     value: "http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090" }
            - name: PGHOST
              valueFrom:
                configMapKeyRef: { name: platform-config, key: PGHOST }
            - { name: AWS_REGION,   value: "ap-northeast-1" }
            - { name: TARGET_NAMESPACE, value: "default" }
            - { name: AGENT_VERSION,    value: "v6.1.3" }
            - name: ALERT_EMAIL
              valueFrom:
                configMapKeyRef: { name: platform-config, key: alert-email }
            # v6:追蹤後端就是這一行。換 Langfuse/Jaeger/OpenObserve 只改這裡。
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.monitoring.svc:4318" }
            - { name: OTEL_SERVICE_NAME, value: "w3-ai-agent" }
            # 換到不支援 json_schema 的模型時,把這個設為 false
            - { name: USE_STRUCTURED_OUTPUT, value: "true" }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: postgres-password }
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: litellm-master-key }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  labels: { app: ai-agent }   # 專用 ServiceMonitor 選的是 Service metadata label
spec:
  selector: { app: ai-agent }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# 專屬 ServiceMonitor,不與 W2 業務服務那個混用；注意 selector 會比對上面的 Service metadata labels
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-agent
  namespace: monitoring
  labels: { release: kps }
spec:
  namespaceSelector: { matchNames: ["default"] }
  selector: { matchLabels: { app: ai-agent } }
  endpoints: [{ port: http, path: /metrics, interval: 30s }]
