apiVersion: apps/v1
kind: Deployment
metadata:
  name: engops-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engops-api
  template:
    metadata:
      labels:
        app: engops-api
    spec:
      serviceAccountName: engops-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/a4225344a/engops-api:sha-4f9e4fdd59d3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: PGHOST
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PROM_URL
              value: "http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090"
            # Fork 這份 repo 的人請改成自己的 "owner/platform-gitops",
            # 這裡沒有 GitHub Actions 可以套用 vars.*,所以直接改這個值。
            - name: GITOPS_REPO
              value: A4225344A/platform-gitops
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: postgres-password
            - name: ENGOPS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: engops-api-token
            - name: ENGOPS_API_ORIGIN_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: engops-api-token
            - name: ENGOPS_DECISION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: engops-decision-token
                  optional: true
            # 沒設之前 /api/v1/incidents/{id}/ask 一律回 503,不影響其他端點。
            - name: ASK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ask-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 320Mi
---
apiVersion: v1
kind: Service
metadata:
  name: engops-api
  namespace: default
  labels:
    app: engops-api
spec:
  selector:
    app: engops-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: engops-api
  namespace: monitoring
  labels:
    release: kps
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      app: engops-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
