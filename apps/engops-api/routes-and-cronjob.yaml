apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: engops
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: engops-api
          port: 8000
          weight: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scorecard-eval
  namespace: default
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              command: ["sh", "-c"]
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: platform-secrets
                      key: engops-api-token
              args:
                - |
                  curl -f --max-time 120 -X POST \
                    -H "Authorization: Bearer $TOKEN" \
                    http://engops-api:8000/api/v1/scorecards/selfheal-readiness/evaluate
