apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
spec:
  selector: {matchLabels: {app: inventory-api}}
  template:
    metadata:
      labels: {app: inventory-api, tier: app}
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: inventory-api}
      containers:
        - name: inventory-api
          image: ghcr.io/a4225344a/platform-service@sha256:a84a181cb904012462a0f2fada5d3daabde9c9d1195b30a5876fa668b32ec48e
          ports: [{containerPort: 8080}]
          env:
            - name: SERVICE_NAME
              value: "inventory-api"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {memory: "256Mi"}
          startupProbe: {httpGet: {path: /healthz, port: 8080}, failureThreshold: 10, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  labels: {app: inventory-api, tier: app}
spec:
  selector: {app: inventory-api}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-route
spec:
  parentRefs: [{name: platform-gateway}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /inventory}}]
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /WeatherForecast}
      backendRefs: [{name: inventory-api, port: 80}]
