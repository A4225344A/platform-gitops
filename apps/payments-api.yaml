apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 2
  selector: {matchLabels: {app: payments-api}}
  template:
    metadata:
      labels: {app: payments-api, tier: app}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: payments-api
          image: ghcr.io/a4225344a/platform-service@sha256:5b9f44529d9f613f31acff3a403d3bd00c1d6404e12f5ea72b8dea512dcc7a75
          ports: [{containerPort: 8080}]
          env:
            - name: SERVICE_NAME
              value: "payments-api"
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "250m", memory: "256Mi"}
          startupProbe: {httpGet: {path: /healthz, port: 8080}, failureThreshold: 10, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  labels: {app: payments-api}
spec:
  selector: {app: payments-api}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-route
spec:
  parentRefs: [{name: platform-gateway}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /payments}}]
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /WeatherForecast}
      backendRefs: [{name: payments-api, port: 80}]
