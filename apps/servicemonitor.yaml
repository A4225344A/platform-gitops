apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-services
  namespace: monitoring
  labels: { release: kps }
spec:
  namespaceSelector: { matchNames: ["default"] }
  selector:
    matchLabels: { tier: app }
  endpoints: [{ port: http, path: /metrics, interval: 30s }]
