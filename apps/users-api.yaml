apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
spec:
  selector: {matchLabels: {app: users-api}}
  template:
    metadata:
      labels: {app: users-api, tier: app}
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: users-api}
      containers:
        - name: users-api
          image: ghcr.io/a4225344a/platform-service@sha256:c1e1e1dd13f83d4b6129e20ef213742e979632bbd9413c1ceea11f685110ad6b
          ports: [{containerPort: 8080}]
          env:
            - name: SERVICE_NAME
              value: "users-api"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {memory: "256Mi"}
          startupProbe: {httpGet: {path: /healthz, port: 8080}, failureThreshold: 10, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  labels: {app: users-api, tier: app}
spec:
  selector: {app: users-api}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: users-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
  rules:
    - matches: [{path: {type: PathPrefix, value: /users}}]
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /WeatherForecast}
      backendRefs:
        - group: ""
          kind: Service
          name: users-api
          port: 80
          weight: 1
