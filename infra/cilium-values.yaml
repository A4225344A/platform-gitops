kubeProxyReplacement: true
k8sServiceHost: 10.0.1.100      # ⚠️ 每次重建要換成新的控制節點內網 IP
k8sServicePort: 6443
ipam: { mode: kubernetes }
resources:
  requests: { memory: 256Mi }
  limits:   { memory: 512Mi }
operator: { replicas: 1 }
gatewayAPI:
  enabled: true
  hostNetwork: { enabled: true }
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy: [NET_ADMIN, PERFMON, BPF, NET_BIND_SERVICE]
